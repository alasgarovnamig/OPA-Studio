# OPA Studio for OPA v0.5.12.
#
#   OPA_STUDIO_BASIC_PASSWORD=change-me docker compose -f deploy/docker-compose.yml up --build
#
# OPA v0.5.12 has no `opa run --set` flag, so this release ships no agent example;
# connect existing OPA servers with OPA_STUDIO_CONNECTIONS.
services:
  studio:
    build: ..
    image: opa-studio:v0.5.12
    platform: linux/amd64 # OPA v0.5.12 ships no linux/arm64 binary
    ports:
      - "9080:9080"
    environment:
      OPA_STUDIO_AUTH_MODE: basic
      OPA_STUDIO_BASIC_USER: admin
      OPA_STUDIO_BASIC_PASSWORD: ${OPA_STUDIO_BASIC_PASSWORD:?set OPA_STUDIO_BASIC_PASSWORD}
    volumes:
      - studio-data:/var/lib/opa-studio
    restart: unless-stopped

volumes:
  studio-data:
